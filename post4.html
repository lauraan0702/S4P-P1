<!DOCTYPE html>
<html>
<head>
    <title>BORI</title>
    <link rel="stylesheet" href="bori.css">

    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

<div class="page">

    <div class="left">
        <div class="menu">
            <div class="menu-item">
                <a href="index.html">
                    <img class="logo" src="bori.png">
                </a>
            </div>

            <div class="menu-item">
                <a href="index.html">
                    <h2>HOME</h2>
                </a>
            </div>

            <div class="menu-item">
                <a href="friends.html">
                    <h2>MY PACK</h2>
                </a>
            </div>

        </div>
    </div>

    <div class="feed">

        <div class="post-page-header">
            <a href="index.html" class="back-icon">
                <img src="back.svg">
            </a>
            <h2>Post</h2>
        </div>

        <div class="post">

            <div class="post-header">
                <h3>
                    Bori <br>
                    <span class="username">@kingbori</span>
                </h3>
            </div>

            <div class="post-content">
                <p>
                    Going to the grocery store to buy treats.
                </p>

                <img class="single-post-image" src="IMG_2943.jpeg">
            </div>

            <div class="post-header">
                <h3>
                    <span class="username">8:39 AM</span>
                    <span class="username">·</span>
                    <span class="username">Jul 30, 2026</span>
                </h3>
            </div>

            <div class="page-engagement">
                <div class="page-engagement-item">
                    <button class="like-button">
                        <img src="like.svg" class="like-icon">
                    </button>
                    <span class="like-count">0</span>
                </div>

                <div class="page-engagement-item">
                    <button class="comment-button">
                        <img src="comment.svg" class="comment-icon">
                    </button>
                    <span class="comment-count">0</span>
                </div>

                <div class="page-engagement-item">
                    <img src="views.svg" class="view-icon">
                    <span>38</span>
                </div>
            </div>

            <div class="reply-box">
                <textarea class="reply-input" placeholder="Post your reply"></textarea>
                <button class="reply-button">Reply</button>
            </div>

            <div class="comments"></div>
        </div>
    </div>

    <div class="right">
        <div class="trending">

            <div class="trending-item"><h2>What's happening</h2></div>

            <div class="trending-item">
                <span class="trending-heading">Trending</span>
                <span class="trending-text">Squirrel Spotted</span>
            </div>

            <div class="trending-item">
                <span class="trending-heading">Nearby</span>
                <span class="trending-text">Bone on Street</span>
            </div>

            <div class="trending-item">
                <span class="trending-heading">Trending</span>
                <span class="trending-text">New Dog Next Door</span>
            </div>

            <div class="trending-item">
                <span class="trending-heading">Trending</span>
                <span class="trending-text">Escape the Vet</span>
            </div>

        </div>
    </div>

</div>

<script src="bori.js"></script>
</body>
</html>
